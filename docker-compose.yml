services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: updownlivenewspassword
      POSTGRES_DB: management_bot
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bot -d management_bot" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - ./alembic/versions:/app/alembic/versions
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python main.py
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
